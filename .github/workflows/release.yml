name: release

# Run by a push to main whose commit message has [release], by hand (Actions > release > Run workflow) or by a tag v1.2.3: builds DIAP_Setup_1.2.3.exe on Windows, installs it on the runner as a smoke test, and puts
# it on a release of this (private) repo. With the secret RELEASES_TOKEN (a token that can write to
# kammy0328/Contour-Releases) it is also published there, which is where the app looks for updates.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

env:
  PY_VER: "3.12.10"
  PUBLIC_REPO: kammy0328/Contour-Releases

jobs:
  build:
    # a push to main builds only when its commit message has [release]
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    env:
      HAS_PUBLIC_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Version
        id: v
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci | Out-Null; Start-Transcript -Append -Path ci\log.txt | Out-Null
          $ver = (Select-String -Path contour\core\settings.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$ver") { throw "tag $env:GITHUB_REF_NAME != APP_VERSION $ver" }
          "ver=$ver" >> $env:GITHUB_OUTPUT

      - name: Embeddable Python
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci | Out-Null; Start-Transcript -Append -Path ci\log.txt | Out-Null
          New-Item -ItemType Directory -Force build\python | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PY_VER/python-$env:PY_VER-embed-amd64.zip" -OutFile build\py.zip
          Expand-Archive build\py.zip -DestinationPath build\python -Force
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile build\python\get-pip.py
          $pth = Get-ChildItem build\python -Filter "python3*._pth" | Select-Object -First 1
          Set-Content -Path $pth.FullName -Encoding ascii -Value @("python312.zip", ".", "Lib\site-packages", "..\app", "import site")
          Get-Content $pth.FullName
          # DIAP.exe: the windowed python under the app's own name and icon (taskbar, Task Manager, pinning)
          Invoke-WebRequest "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile build\rcedit.exe
          Copy-Item build\python\pythonw.exe build\python\DIAP.exe
          & build\rcedit.exe build\python\DIAP.exe --set-icon assets\icon.ico --set-version-string FileDescription DIAP --set-version-string ProductName DIAP --set-version-string CompanyName SEWOO --set-version-string OriginalFilename DIAP.exe --set-version-string InternalName DIAP
          if ($LASTEXITCODE -ne 0) { throw "rcedit failed" }

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci | Out-Null; Start-Transcript -Append -Path ci\log.txt | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          "iscc: $iscc exists=$(Test-Path $iscc)"
          & $iscc /Qp "/DAppVer=${{ steps.v.outputs.ver }}" "/DSrc=$PWD" "/DPy=$PWD\build\python" installer\contour.iss 2>&1 | Tee-Object -FilePath ci\iscc.txt | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $exe = "dist\DIAP_Setup_${{ steps.v.outputs.ver }}.exe"
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$h  DIAP_Setup_${{ steps.v.outputs.ver }}.exe" | Set-Content -Encoding ascii "$exe.sha256"
          Get-Item $exe | Format-List Name, Length
          Write-Host "SHA256 $h"

      - name: Smoke test (install and import)
        shell: pwsh
        env:
          CONTOUR_CI: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = "dist\DIAP_Setup_${{ steps.v.outputs.ver }}.exe"
          $p = Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\ct" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          Get-Content C:\ct\setup_log.txt
          Get-Process pythonw, DIAP -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path C:\ct\python\DIAP.exe)) { throw "DIAP.exe missing" }
          & C:\ct\python\python.exe -c "import sys; print(sys.version); import numpy, cv2, PySide6, onnxruntime, scipy, PyOpenColorIO; import contour.batch; from contour.ui import main_window, update, gatedlg, splash; from contour.core import gate, updater; from contour.track import faceparse, facelayer, faceflow; assert gate.check('0328'); print('ok', onnxruntime.get_available_providers())" 2>&1 | Tee-Object -FilePath ci\smoke.txt
          if ($LASTEXITCODE -ne 0) { throw "import failed" }
          Push-Location C:\ct\app
          & C:\ct\python\python.exe -m contour.batch --help 2>&1 | Tee-Object -Append -FilePath "$env:GITHUB_WORKSPACE\ci\smoke.txt"
          Pop-Location

      - name: Update from 1.8.1 (per user) to this version (Program Files)
        shell: pwsh
        timeout-minutes: 60
        env:
          CONTOUR_CI: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          Start-Transcript -Append -Path ci\log.txt | Out-Null
          $out = "$env:GITHUB_WORKSPACE\ci\upgrade.txt"
          Copy-Item C:\ct\setup_log.txt ci\setup_ct.txt -ErrorAction SilentlyContinue
          # the smoke test's machine-wide copy out first: the user's PC has only 1.8.1
          $p = Start-Process C:\ct\unins000.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "uninstall timed out" }
          Start-Sleep 8
          "uninstall C:\ct exit $($p.ExitCode) left=$(Test-Path C:\ct\python)" | Tee-Object -Append -FilePath $out
          Invoke-WebRequest "https://github.com/$env:PUBLIC_REPO/releases/download/v1.8.1/Contour_Setup_1.8.1.exe" -OutFile old.exe
          $p = Start-Process .\old.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          # -Wait would also wait for an app the setup started afterwards: wait for the setup process only
          if (-not $p.WaitForExit(1500000)) { $p.Kill(); throw "1.8.1 setup timed out" }
          $old = "$env:LOCALAPPDATA\Programs\Contour"
          "1.8.1 exit $($p.ExitCode) present=$(Test-Path "$old\python\python.exe")" | Tee-Object -Append -FilePath $out
          if (-not (Test-Path "$old\python\python.exe")) { throw "1.8.1 did not install" }
          Get-Process pythonw, python, DIAP -ErrorAction SilentlyContinue | Stop-Process -Force
          # exactly what 1.8.1's updater runs
          $exe = "$env:GITHUB_WORKSPACE\dist\DIAP_Setup_${{ steps.v.outputs.ver }}.exe"
          $p = Start-Process $exe -ArgumentList "/SILENT","/SUPPRESSMSGBOXES","/NORESTART","/CLOSEAPPLICATIONS","/UPDATE=1","/DIR=$old" -PassThru
          if (-not $p.WaitForExit(1500000)) { $p.Kill(); throw "update setup timed out" }
          for ($i = 0; $i -lt 30 -and (Test-Path "$old\python"); $i++) { Start-Sleep 2 }
          Get-Process pythonw, DIAP -ErrorAction SilentlyContinue | Stop-Process -Force
          $new = "C:\Program Files\Diap"
          $key = Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{0432DE7E-AD09-4B89-8929-0B95959C384F}_is1"
          "update exit $($p.ExitCode) new=$(Test-Path "$new\python\DIAP.exe") app=$(Test-Path "$new\app\app.py") stamp=$(Test-Path "$new\python\.contour_packages") old_left=$(Test-Path "$old\python") old_key=$key" | Tee-Object -Append -FilePath $out
          Get-Content "$new\setup_log.txt" -ErrorAction SilentlyContinue | Select-Object -Last 15 | Tee-Object -Append -FilePath $out
          if ($p.ExitCode -ne 0) { throw "update exit $($p.ExitCode)" }
          if (-not (Test-Path "$new\app\app.py")) { throw "not installed to Program Files" }
          if (-not (Test-Path "$new\python\.contour_packages")) { throw "packages not installed" }
          if (Test-Path "$old\python") { throw "old per-user copy still there" }
          & "$new\python\python.exe" -c "import contour.core.settings as s, onnxruntime, PySide6, cv2; print('ok', s.APP_NAME, s.APP_VERSION)" 2>&1 | Tee-Object -Append -FilePath $out
          if ($LASTEXITCODE -ne 0) { throw "import failed after update" }

      - name: Replace an earlier build of the same version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $v = "v${{ steps.v.outputs.ver }}"
          gh release delete $v --repo ${{ github.repository }} --yes --cleanup-tag 2>&1 | Tee-Object -Append -FilePath ci\release.txt
          if ($env:PUB_TOKEN) { $env:GH_TOKEN = $env:PUB_TOKEN; gh release delete $v --repo $env:PUBLIC_REPO --yes --cleanup-tag 2>&1 | Tee-Object -Append -FilePath ci\release.txt }
          exit 0

      - name: Release (private)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          name: DIAP ${{ steps.v.outputs.ver }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/DIAP_Setup_${{ steps.v.outputs.ver }}.exe
            dist/DIAP_Setup_${{ steps.v.outputs.ver }}.exe.sha256
          body_path: installer/RELEASE_NOTES.md

      - name: Publish (public, for updates)
        if: env.HAS_PUBLIC_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci | Out-Null; Start-Transcript -Append -Path ci\log.txt | Out-Null
          gh release create "v${{ steps.v.outputs.ver }}" --repo $env:PUBLIC_REPO --title "DIAP ${{ steps.v.outputs.ver }}" --notes-file installer/RELEASE_NOTES.md "dist/DIAP_Setup_${{ steps.v.outputs.ver }}.exe" "dist/DIAP_Setup_${{ steps.v.outputs.ver }}.exe.sha256" 2>&1 | Tee-Object -Append -FilePath ci\release.txt
          if ($LASTEXITCODE -ne 0) { throw "public release failed" }

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: DIAP_Setup_${{ steps.v.outputs.ver }}
          path: dist/*

      - name: Report (a check run named ci-log carries the log, readable without the Actions API)
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $log = ""
          if (Test-Path ci\log.txt) { $log = Get-Content ci\log.txt -Raw }
          Get-ChildItem ci -Filter *.txt -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne "log.txt" } | ForEach-Object { $log += "`n===== $($_.Name) =====`n" + (Get-Content $_.FullName -Raw) }
          if (Test-Path C:\ct\setup_log.txt) { $log += "`n===== setup_log =====`n" + (Get-Content C:\ct\setup_log.txt -Raw) }
          $dist = (Get-ChildItem dist -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name) $($_.Length)" }) -join "`n"
          $text = "job ${{ job.status }}`n$dist`n`n$log"
          if ($text.Length -gt 60000) { $text = $text.Substring($text.Length - 60000) }
          $body = @{ name = "ci-log"; head_sha = "${{ github.sha }}"; status = "completed"; conclusion = "neutral";
                     output = @{ title = "job ${{ job.status }}"; summary = $text } } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/${{ github.repository }}/check-runs" `
            -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" } `
            -Body $body -ContentType "application/json" | Out-Null
