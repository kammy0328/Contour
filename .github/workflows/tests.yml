name: tests
# Regression tests that need no GPU and no model (tests/): run on every push to a branch and on pull requests.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages (ffmpeg, Qt offscreen libraries)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Python packages (CPU onnxruntime instead of the GPU build)
        run: |
          grep -v -i "onnxruntime" requirements.txt > /tmp/req.txt
          python -m pip install -r /tmp/req.txt onnxruntime pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
